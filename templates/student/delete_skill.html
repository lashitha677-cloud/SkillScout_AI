<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Skill | SkillScout AI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background: #070b16;
            color: white;

            font-family: Arial, sans-serif;
        }

        .delete-card {
            width: 90%;
            max-width: 450px;

            padding: 35px;

            background: #10172a;

            border: 1px solid #292f45;

            border-radius: 18px;

            text-align: center;
        }

        .icon {
            width: 60px;
            height: 60px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #2a1620;

            color: #ff6b81;

            font-size: 25px;
        }

        .delete-card h1 {
            font-size: 22px;
            margin-bottom: 12px;
        }

        .delete-card p {
            color: #9da6ba;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .skill-name {
            color: #aaa0ff;
            font-weight: bold;
            font-size: 16px;

            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
