<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Project | SkillScout AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #070b16;
            color: white;
        }

        .card {
            width: 90%;
            max-width: 500px;

            padding: 35px;

            text-align: center;

            background: #10172a;

            border: 1px solid #202941;

            border-radius: 18px;
        }

        .icon {
            width: 55px;
            height: 55px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #321923;

            color: #ff8d9b;

            font-size: 23px;
        }

        h1 {
            margin: 0 0 12px;

            font-size: 24px;
        }

        p {
            color: #737d94;

            font-size: 12px;

            line-height: 1.6;

            margin-bottom: 8px;
        }

        .project-name {
            color: white;

            font-size: 15px;

            font-weight: bold;

            margin: 15px 0 25px;
        }

        .buttons {
            display: flex;

            justify-content: center;

            gap: 12px;
        }

        button,
        a {
            padding: 12px 18px;

            border-radius: 9px;

            font-size: 11px;

            font-weight: bold;

            text-decoration: none;

            cursor: pointer;
        }

        button {
            border: none;

            background: #d94f64;

            color: white;
        }

        button:hover {
            background: #ed6175;
        }

        .cancel {
            border: 1px solid #293249;

            background: #0b1120;

            color: #aeb5c5;
        }

        .cancel:hover {
            border-color: #6c5ce7;

            color: white;
        }

        @media (max-width: 500px) {

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<div class="card">


    <div class="icon">
        🗑
    </div>


    <h1>
        Delete Project?
    </h1>


    <p>
        Are you sure you want to delete this project?
    </p>


    <div class="project-name">
        {{ project.project_title }}
    </div>


    <p>
        This action cannot be undone.
    </p>


    <form method="POST">

        {% csrf_token %}


        <div class="buttons">


            <button type="submit">
                Yes, Delete Project
            </button>


            <a
                href="{% url 'edit_project' project.id %}"
                class="cancel">

                Cancel

            </a>


        </div>

    </form>


</div>


</body>

</html>
