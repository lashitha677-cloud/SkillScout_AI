<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Skill | SkillScout AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #070b16;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 90%;
            max-width: 550px;

            background: #10172a;
            border: 1px solid #202941;
            border-radius: 18px;

            padding: 30px;
        }

        .brand {
            color: #8879ff;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #737d94;
            font-size: 12px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #aeb5c5;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;

            background: #0b1120;
            border: 1px solid #293249;
            border-radius: 10px;

            color: white;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #6c5ce7;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .save-button {
            flex: 1;

            border: none;
            border-radius: 10px;

            padding: 13px;

            background: #6c5ce7;
            color: white;

            font-weight: bold;
            cursor: pointer;
        }

        .delete-button {
            flex: 1;

            border: none;
            border-radius: 10px;

            padding: 13px;

            background: #3a1720;
            color: #ff7d91;

            font-weight: bold;
            cursor: pointer;
        }

        .back {
            display: block;
            margin-top: 18px;

            color: #8879ff;
            text-decoration: none;

            font-size: 11px;
            text-align: center;
        }

    </style>

</head>


<body>

<div class="card">

    <div class="brand">
        ✦ SKILLSCOUT AI
    </div>

    <h1>
        Edit Technical Skill
    </h1>

    <p class="subtitle">
        Update your skill information.
    </p>


    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label>
                Skill Name
            </label>

            {{ form.skill_name }}

        </div>


        <div class="form-group">

            <label>
                Skill Level
            </label>

            {{ form.skill_level }}

        </div>


        <div class="form-group">

            <label>
                Years of Experience
            </label>

            {{ form.years_experience }}

        </div>


        <div class="buttons">

            <button
                type="submit"
                class="save-button">

                Save Changes

            </button>


            <button
                type="button"
                class="delete-button"
                onclick="deleteSkill()">

                Delete Skill

            </button>

        </div>

    </form>


    <a
        href="{% url 'skill_passport' %}"
        class="back">

        ← Back to Skill Passport

    </a>

</div>


<script>

function deleteSkill() {

    if (confirm("Are you sure you want to delete this skill?")) {

        const form = document.createElement("form");

        form.method = "POST";

        form.action =
            "{% url 'delete_skill' skill.id %}";


        const csrf = document.createElement("input");

        csrf.type = "hidden";
        csrf.name = "csrfmiddlewaretoken";
        csrf.value =
            document.querySelector(
                "[name=csrfmiddlewaretoken]"
            ).value;


        form.appendChild(csrf);

        document.body.appendChild(form);

        form.submit();

    }

}

</script>

</body>

</html>
