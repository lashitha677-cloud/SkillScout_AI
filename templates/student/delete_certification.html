<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Certification | SkillScout AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #070b16;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 480px;

            padding: 35px;

            text-align: center;

            background: #10172a;

            border: 1px solid #202941;

            border-radius: 18px;
        }

        .icon {
            width: 55px;
            height: 55px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(255, 80, 80, 0.12);

            font-size: 22px;
        }

        .brand {
            color: #8879ff;

            font-size: 10px;

            letter-spacing: 1px;

            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 12px;

            font-size: 24px;
        }

        p {
            color: #737d94;

            font-size: 12px;

            line-height: 1.6;
        }

        .certificate-name {
            margin: 20px 0;

            padding: 15px;

            background: #0b1120;

            border: 1px solid #293249;

            border-radius: 10px;

            color: white;

            font-size: 13px;

            font-weight: bold;
        }

        .buttons {
            display: flex;

            gap: 10px;

            margin-top: 25px;
        }

        .delete-button,
        .cancel-button {
            flex: 1;

            padding: 12px;

            border-radius: 9px;

            font-size: 11px;

            font-weight: bold;

            cursor: pointer;

            text-decoration: none;
        }

        .delete-button {
            border: none;

            background: #d94b5b;

            color: white;
        }

        .delete-button:hover {
            background: #e15b69;
        }

        .cancel-button {
            display: flex;

            align-items: center;
            justify-content: center;

            border: 1px solid #293249;

            background: #191c35;

            color: #aaa0ff;
        }

        .cancel-button:hover {
            background: #222642;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="icon">
        🗑
    </div>

    <div class="brand">
        SKILLSCOUT AI
    </div>

    <h1>
        Delete Certification?
    </h1>

    <p>
        Are you sure you want to delete this certification?
        This action cannot be undone.
    </p>


    <div class="certificate-name">

        {{ certification.certificate_name }}

    </div>


    <form method="POST">

        {% csrf_token %}

        <div class="buttons">

            <a
                href="{% url 'edit_certification' certification.id %}"
                class="cancel-button">

                Cancel

            </a>

            <button
                type="submit"
                class="delete-button">

                Delete Certification

            </button>

        </div>

    </form>

</div>

</body>

</html>
