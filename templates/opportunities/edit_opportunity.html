<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Opportunity | SkillScout AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #070b16;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 750px;

            margin: auto;
            padding: 50px 0;
        }

        .badge {
            color: #8879ff;
            font-size: 10px;
            letter-spacing: 1px;
        }

        h1 {
            margin: 10px 0;
            font-size: 32px;
        }

        .subtitle {
            color: #737d94;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .form-card {
            padding: 28px;

            background: #10172a;

            border: 1px solid #202941;

            border-radius: 18px;
        }

        .form-card p {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #aeb5c5;

            font-size: 11px;

            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;

            padding: 12px;

            border: 1px solid #293249;

            border-radius: 9px;

            outline: none;

            background: #0b1120;

            color: white;

            font-size: 12px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #6c5ce7;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .save-button {
            padding: 12px 18px;

            border: none;
            border-radius: 9px;

            background: #6c5ce7;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        .save-button:hover {
            background: #7969ee;
        }

        .back-button {
            padding: 12px 18px;

            border: 1px solid #293249;
            border-radius: 9px;

            background: #191c35;

            color: #aaa0ff;

            text-decoration: none;

            font-size: 11px;

            font-weight: bold;
        }

        .back-button:hover {
            background: #293249;
        }


        .delete-area {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid #202941;
}

.delete-button {
    display: inline-block;
    padding: 10px 15px;

    background: #25151b;
    border: 1px solid #5a2732;
    border-radius: 9px;

    color: #ff7b8b;
    text-decoration: none;

    font-size: 11px;
    font-weight: bold;
}

.delete-button:hover {
    background: #8f3042;
    color: white;
}

    </style>

</head>

<body>

<div class="container">

    <span class="badge">SKILLSCOUT AI • STAFF</span>

    <h1>Edit Opportunity</h1>

    <p class="subtitle">
        Update the opportunity details before matching students.
    </p>


    <div class="form-card">

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="actions">

    <button
        type="submit"
        class="save-button"
    >
        Save Changes
    </button>

    <a
        href="{% url 'staff_dashboard' %}"
        class="back-button"
    >
        ← Back
    </a>

</div>

<div class="delete-area">

    <a
        href="{% url 'delete_opportunity' opportunity.id %}"
        class="delete-button"
    >
        🗑 Delete Opportunity
    </a>

</div>

        </form>

    </div>

</div>

</body>

</html>
